server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://auth-service:8081
            predicates:
              - Path=/api/auth/**
          - id: user-service
            uri: http://user-service:8082
            predicates:
              - Path=/api/users/**
          - id: activity-service
            uri: http://activity-service:8083
            predicates:
              - Path=/api/activity/**
          - id: messaging-service
            uri: http://messaging-service:8084
            predicates:
              - Path=/api/messages/**, /api/ai/**
          - id: analytics-service
            uri: http://analytics-service:8085
            predicates:
              - Path=/api/analytics/**
          - id: notification-service
            uri: http://notification-service:8086
            predicates:
              - Path=/api/notifications/**
          - id: ai-service
            uri: http://ai-service:8000
            predicates:
              - Path=/ai/**
