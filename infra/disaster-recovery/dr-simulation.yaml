# ============================================================================
# Disaster Recovery: Simulation & Validation Framework
#
# Automated DR exercises that validate RTO/RPO targets.
# Run monthly; results feed into compliance reports.
# ============================================================================

# ── DR Simulation CronJob ───────────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-simulation
  namespace: projectx-staging
  labels:
    app: dr-simulator
spec:
  schedule: "0 2 1 * *"   # 2 AM on the 1st of every month
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: dr-simulator
          containers:
            - name: dr-runner
              image: ghcr.io/projectx/dr-simulator:latest
              env:
                - name: DR_SCENARIO
                  value: "full_regional_failover"
                - name: TARGET_RTO_MINUTES
                  value: "15"
                - name: TARGET_RPO_MINUTES
                  value: "5"
                - name: SLACK_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: dr-secrets
                      key: slack-webhook
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "=== ProjectX DR Simulation ==="
                  echo "Started: $(date -u)"
                  echo "Scenario: $DR_SCENARIO"
                  echo ""
                  
                  # Phase 1: Pre-check baseline health
                  echo "Phase 1: Baseline Health Check"
                  BASELINE_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
                    http://api-gateway.projectx-staging/actuator/health)
                  echo "  Gateway health: $BASELINE_HEALTH"
                  
                  BASELINE_AI=$(curl -s -o /dev/null -w "%{http_code}" \
                    http://ai-service.projectx-staging/docs)
                  echo "  AI service health: $BASELINE_AI"
                  
                  # Phase 2: Simulate primary region failure
                  echo ""
                  echo "Phase 2: Simulating Primary Region Failure"
                  FAILOVER_START=$(date +%s)
                  
                  kubectl scale deploy api-gateway -n projectx-staging --replicas=0
                  kubectl scale deploy messaging-service -n projectx-staging --replicas=0
                  kubectl scale deploy ai-service -n projectx-staging --replicas=0
                  
                  echo "  All primary services scaled to 0"
                  
                  # Phase 3: Verify secondary region takes over
                  echo ""
                  echo "Phase 3: Verifying Secondary Region Takeover"
                  sleep 30
                  
                  SECONDARY_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
                    http://api-gateway-secondary.projectx-staging/actuator/health 2>/dev/null || echo "000")
                  echo "  Secondary region health: $SECONDARY_HEALTH"
                  
                  # Phase 4: Restore primary region
                  echo ""
                  echo "Phase 4: Restoring Primary Region"
                  kubectl scale deploy api-gateway -n projectx-staging --replicas=3
                  kubectl scale deploy messaging-service -n projectx-staging --replicas=3
                  kubectl scale deploy ai-service -n projectx-staging --replicas=2
                  
                  # Wait for readiness
                  kubectl rollout status deploy/api-gateway -n projectx-staging --timeout=300s
                  kubectl rollout status deploy/messaging-service -n projectx-staging --timeout=300s
                  kubectl rollout status deploy/ai-service -n projectx-staging --timeout=300s
                  
                  FAILOVER_END=$(date +%s)
                  ACTUAL_RTO=$(( (FAILOVER_END - FAILOVER_START) / 60 ))
                  
                  echo ""
                  echo "Phase 5: DR Results"
                  echo "  Target RTO: ${TARGET_RTO_MINUTES} minutes"
                  echo "  Actual RTO: ${ACTUAL_RTO} minutes"
                  
                  if [ "$ACTUAL_RTO" -le "$TARGET_RTO_MINUTES" ]; then
                    echo "  ✅ RTO: PASSED"
                    RTO_STATUS="PASSED"
                  else
                    echo "  ❌ RTO: FAILED"
                    RTO_STATUS="FAILED"
                  fi
                  
                  # Phase 6: Data consistency check (RPO validation)
                  echo ""
                  echo "Phase 6: RPO Validation"
                  FINAL_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
                    http://api-gateway.projectx-staging/actuator/health)
                  echo "  Post-recovery health: $FINAL_HEALTH"
                  
                  if [ "$FINAL_HEALTH" = "200" ]; then
                    echo "  ✅ Post-recovery: HEALTHY"
                    HEALTH_STATUS="HEALTHY"
                  else
                    echo "  ❌ Post-recovery: UNHEALTHY"
                    HEALTH_STATUS="UNHEALTHY"
                  fi
                  
                  # Phase 7: Report to Slack
                  echo ""
                  echo "Phase 7: Sending Report"
                  curl -X POST "$SLACK_WEBHOOK" \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"text\": \"🔄 *DR Simulation Report*\n\nScenario: ${DR_SCENARIO}\nDate: $(date -u)\n\n*Results:*\n• RTO Target: ${TARGET_RTO_MINUTES}min | Actual: ${ACTUAL_RTO}min | ${RTO_STATUS}\n• Post-Recovery: ${HEALTH_STATUS}\n• Baseline Health: ${BASELINE_HEALTH}\n• Final Health: ${FINAL_HEALTH}\n\n_Full report in Grafana DR dashboard_\"
                    }" 2>/dev/null || echo "Slack notification skipped"
                  
                  echo ""
                  echo "=== DR Simulation Complete ==="
          restartPolicy: Never
      backoffLimit: 1

---
# ── DR Metrics Recording Rules ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: dr-prometheus-rules
  namespace: projectx-prod
data:
  dr-rules.yml: |
    groups:
      - name: dr.tracking
        rules:
          # Track last successful DR test timestamp
          - record: dr:last_successful_test_timestamp
            expr: max(dr_simulation_completion_timestamp{status="passed"})

          # Alert if no DR test in 45 days
          - alert: DRTestOverdue
            expr: (time() - dr:last_successful_test_timestamp) > 3888000
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "DR test overdue: last test was over 45 days ago"
              
          # Track RTO trend
          - record: dr:rto_minutes
            expr: dr_simulation_rto_seconds / 60
