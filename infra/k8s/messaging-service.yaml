apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: dating-aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
    spec:
      containers:
        - name: messaging-service
          image: ghcr.io/shivamsingh2004/projectx-messaging-service:latest
          ports:
            - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: dating-aggregator
spec:
  selector:
    app: messaging-service
  ports:
    - port: 8084
      targetPort: 8084
