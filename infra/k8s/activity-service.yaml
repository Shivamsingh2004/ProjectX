apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: dating-aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      containers:
        - name: activity-service
          image: ghcr.io/shivamsingh2004/projectx-activity-service:latest
          ports:
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: activity-service
  namespace: dating-aggregator
spec:
  selector:
    app: activity-service
  ports:
    - port: 8083
      targetPort: 8083
