# ============================================================================
# Kubernetes Secret Management using External Secrets Operator (ESO)
#
# ESO syncs secrets from AWS Secrets Manager / HashiCorp Vault into
# K8s Secrets automatically, with rotation and refresh intervals.
# No secrets are ever stored in Git or Helm values.
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: projectx-prod
spec:
  provider:
    vault:
      server: "https://vault.internal.projectx.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "projectx-prod"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-service-secrets
  namespace: projectx-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ai-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: NVIDIA_API_KEY
      remoteRef:
        key: projectx/ai-service
        property: nvidia_api_key
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: projectx/redis
        property: password

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: supabase-secrets
  namespace: projectx-prod
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: supabase-secrets
    creationPolicy: Owner
  data:
    - secretKey: SUPABASE_JWT_SECRET
      remoteRef:
        key: projectx/supabase
        property: jwt_secret
    - secretKey: SUPABASE_URL
      remoteRef:
        key: projectx/supabase
        property: url
    - secretKey: SUPABASE_ANON_KEY
      remoteRef:
        key: projectx/supabase
        property: anon_key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-secrets
  namespace: projectx-prod
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: kafka-secrets
    creationPolicy: Owner
  data:
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef:
        key: projectx/kafka
        property: sasl_username
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef:
        key: projectx/kafka
        property: sasl_password
